<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>系統總覽</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e4e2dc;
  --accent:#1f6f5c; --accent-ink:#ffffff; --chip:#ecebe6;
  --t-pub:#2f6db5; --t-sch:#b26b16; --t-pri:#8a3b8f; --warn:#a33a2a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161614; --card:#20201e; --ink:#ecebe6; --muted:#a3a19b; --line:#33322f;
    --accent:#4fb39a; --accent-ink:#0f1f1b; --chip:#2b2a27;
    --t-pub:#7fb0ea; --t-sch:#e7a95c; --t-pri:#d08fd4; --warn:#ef8a78;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 20px}

/* lock screen */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:360px}
#lock h1{font-size:1.25rem;margin-bottom:16px}
#lock input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#lock label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.9rem;color:var(--muted)}
#lock button{width:100%;font:inherit;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#err{color:var(--warn);font-size:.9rem;min-height:1.4em;margin:8px 0 0}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input{flex:1 1 220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}
.ghost{font:inherit;font-size:.85rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);cursor:pointer}

/* sections & cards */
section{margin-bottom:28px}
section h2{font-size:1.05rem;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:1.05rem;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem}
.tag{padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--muted)}
.tier{font-weight:600}
.tier.公開{color:var(--t-pub)} .tier.校內{color:var(--t-sch)} .tier.私人{color:var(--t-pri)}
.sum{margin:0;font-size:.92rem}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.links a{font-size:.88rem;text-decoration:none;padding:6px 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.links a.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.note{font-size:.82rem;color:var(--warn);margin:0}
.loc{font-size:.8rem;color:var(--muted);word-break:break-all;margin:0}
details{font-size:.88rem}
details summary{cursor:pointer;color:var(--muted)}
details ul{margin:6px 0 0;padding-left:20px}
details p{margin:6px 0 0;color:var(--muted)}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div id="lock">
  <form id="f" autocomplete="off">
    <h1>系統總覽</h1>
    <input id="pw" type="password" placeholder="請輸入密碼" autofocus>
    <label><input id="rem" type="checkbox"> 記住這台裝置</label>
    <button type="submit">開啟</button>
    <p id="err"></p>
  </form>
</div>
<div id="app" class="wrap" hidden></div>

const KEY_STORE = 'hub-key-' + ENC.salt.slice(0, 8);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function decrypt(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function store(get, val){ try{ return get ? localStorage.getItem(KEY_STORE) : (val === null ? localStorage.removeItem(KEY_STORE) : localStorage.setItem(KEY_STORE, val)); }catch(e){ return null; } }

async function tryStored(){
  const raw = store(true);
  if(!raw) return false;
  try{
    const key = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
    render(await decrypt(key)); return true;
  }catch(e){ store(false, null); return false; }
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '解密中…';
  try{
    const key = await deriveKey(document.getElementById('pw').value);
    const data = await decrypt(key);
    if(document.getElementById('rem').checked) store(false, tob64(await crypto.subtle.exportKey('raw', key)));
    render(data);
  }catch(e){ err.textContent = '密碼不正確'; }
});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(data){
  document.getElementById('lock').remove();
  const app = document.getElementById('app');
  app.hidden = false;
  let cat = 'all', q = '';
  const count = id => data.systems.filter(s => s.category === id).length;
  app.innerHTML = `
    <h1>系統總覽</h1>
    <p class="sub">共 ${data.systems.length} 項 · 更新於 ${esc(data.updated)}</p>
    <div class="bar">
      <input id="q" type="search" placeholder="搜尋名稱、功能、技術…">
      <button class="ghost" id="lockbtn" type="button">登出並忘記此裝置</button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-c="all" aria-pressed="true">全部<span class="n">${data.systems.length}</span></button>
      ${data.categories.map(c => `<button class="chip" data-c="${c.id}" aria-pressed="false">${esc(c.name)}<span class="n">${count(c.id)}</span></button>`).join('')}
    </div>
    <div id="list"></div>
    <footer>此頁內容經加密；後台、開發與敏感系統網址只保存在私人 repo。</footer>`;

  const list = app.querySelector('#list');
  const card = s => `
    <article class="card">
      <h3>${esc(s.name)}</h3>
      <div class="meta">
        <span class="tag tier ${esc(s.tier)}">${esc(s.tier)}</span>
        <span class="tag">${esc(s.status)}</span>
      </div>
      <p class="sum">${esc(s.summary)}</p>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}
      ${s.location ? `<p class="loc">📁 ${esc(s.location)}</p>` : ''}
      <details>
        <summary>主要功能與說明</summary>
        <ul>${(s.features||[]).map(f => `<li>${esc(f)}</li>`).join('')}</ul>
        <p>技術：${esc(s.tech)}<br>使用者：${esc(s.users)}</p>
        ${(s.docs||[]).length ? `<p>文件：<br>${s.docs.map(esc).join('<br>')}</p>` : ''}
      </details>
      ${(s.links||[]).length ? `<div class="links">${s.links.map((l,i) => `<a class="${i? 'sec':''}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join('')}</div>` : ''}
    </article>`;

  function draw(){
    const kw = q.trim().toLowerCase();
    const hit = s => (cat === 'all' || s.category === cat) &&
      (!kw || [s.name, s.summary, s.tech, s.users, ...(s.features||[])].join(' ').toLowerCase().includes(kw));
    const html = data.categories.map(c => {
      const items = data.systems.filter(s => s.category === c.id && hit(s));
      return items.length ? `<section><h2>${esc(c.name)}</h2><div class="grid">${items.map(card).join('')}</div></section>` : '';
    }).join('');
    list.innerHTML = html || '<p class="empty">沒有符合的系統。</p>';
  }
  app.querySelector('#q').addEventListener('input', e => { q = e.target.value; draw(); });
  app.querySelector('#chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    cat = b.dataset.c;
    app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    draw();
  });
  app.querySelector('#lockbtn').addEventListener('click', () => { store(false, null); location.reload(); });
  draw();
}

tryStored();
</script>
</body>
</html>
